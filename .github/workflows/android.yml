name: Android APK (Preview)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android.yml'
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'vite.config.ts'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm install
      - run: npm run tauri icon src-tauri/icons/icon.png
      - name: Create Android project
        run: npm run tauri android init -- --ci
      - name: Build Android debug APK
        run: npm run tauri android build -- --apk --debug --ci
      - uses: actions/upload-artifact@v4
        with:
          name: DocInspector-Android-APK-Preview
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
