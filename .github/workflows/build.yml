name: Desktop Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install GTK and Tauri dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm install
      - run: npm run tauri icon src-tauri/icons/icon.png
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - run: npm run tauri build -- --bundles deb
      - uses: actions/upload-artifact@v4
        with:
          name: DocInspector-Ubuntu-DEB
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm install
      - run: npm run tauri icon src-tauri/icons/icon.png
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - run: npm run tauri build -- --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: DocInspector-Windows-Installer
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
  release:
    name: Publish GitHub Release
    needs: [linux, windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: DocInspector-*
          path: release-assets
          merge-multiple: true
      - name: Publish installers and checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v$(jq -r .version src-tauri/tauri.conf.json)"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping."
            exit 0
          fi
          shopt -s nullglob
          installers=(release-assets/*.deb release-assets/*.exe)
          if [[ "${#installers[@]}" -ne 2 ]]; then
            echo "::error::Expected both Ubuntu .deb and Windows .exe"
            find release-assets -type f
            exit 1
          fi
          (
            cd release-assets
            sha256sum -- *.deb *.exe > SHA256SUMS.txt
          )
          gh release create "$TAG" "${installers[@]}" release-assets/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "DocInspector $TAG · Lightweight Desktop Release" \
            --notes-file docs/RELEASE_NOTES_v0.3.1.md \
            --latest
