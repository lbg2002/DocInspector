[package]
name = "docinspector"
version = "0.1.0"
description = "Local document inspector"
authors = ["DocInspector contributors"]
edition = "2021"

[lib]
name = "docinspector_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
rayon = "1"
aho-corasick = "1"
calamine = "0.31"
pdf-extract = "0.10"
zip = "2"
quick-xml = "0.37"
csv = "1"
